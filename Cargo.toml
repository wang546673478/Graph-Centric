[package]
name = "graph_harness"
version = "0.1.0"
edition = "2024"
description = "Graph-Centric Agent Harness — universal orchestration via relationship graphs"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
dotenvy = "0.15"
chrono = "0.4"
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.5", features = ["fs", "trace"] }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
smallvec = "1"

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
